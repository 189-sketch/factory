# Machine-local paths only. Agents and pipelines belong in config.toml.
# name is optional and defaults to the machine hostname.
data_directory = "~/.factory/worker"

[control_plane]
url = "http://127.0.0.1:7331"
token_file = "~/.factory/server/worker.token"

[executors.codex]
command = ["codex", "exec", "--sandbox", "danger-full-access", "-"]

[executors.claude]
command = ["claude", "--print", "--dangerously-skip-permissions"]

# Register each repository that managed workers may run in.
# [repositories.my-project]
# path = "/absolute/path/to/my-project"
