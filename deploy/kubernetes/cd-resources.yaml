apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: machinist-state-retain
driver: pd.csi.storage.gke.io
deletionPolicy: Retain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: machinist-deployer
  namespace: machinist-system
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [machinist-control-plane]
    verbs: [get, patch, update, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: machinist-deployer
  namespace: machinist-runners
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [machinist-egress]
    verbs: [get, patch, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods, configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: machinist-deployer
  namespace: machinist-system
subjects:
  - kind: User
    name: machinist-deployer@machinist-prod.iam.gserviceaccount.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: machinist-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: machinist-deployer
  namespace: machinist-runners
subjects:
  - kind: User
    name: machinist-deployer@machinist-prod.iam.gserviceaccount.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: machinist-deployer
