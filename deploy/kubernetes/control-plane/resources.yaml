apiVersion: v1
kind: Namespace
metadata:
  name: machinist-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: machinist-dispatcher
  namespace: machinist-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: machinist-dispatcher
  namespace: machinist-runners
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [codex-account]
    verbs: [get, update]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [machinist-egress]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [agent-isolation, proxy-isolation]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: machinist-dispatcher
  namespace: machinist-runners
subjects:
  - kind: ServiceAccount
    name: machinist-dispatcher
    namespace: machinist-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: machinist-dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: machinist-runtime-reader
rules:
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [gvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: machinist-runtime-reader
subjects:
  - kind: ServiceAccount
    name: machinist-dispatcher
    namespace: machinist-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: machinist-runtime-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: machinist-cluster-access
  namespace: machinist-system
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: dispatcher
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: dispatcher
          namespace: machinist-runners
    current-context: in-cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: machinist-state
  namespace: machinist-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: machinist-private-access
  namespace: machinist-system
spec:
  podSelector:
    matchLabels:
      app: machinist-control-plane
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machinist-control-plane
  namespace: machinist-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: machinist-control-plane
  template:
    metadata:
      labels:
        app: machinist-control-plane
    spec:
      serviceAccountName: machinist-dispatcher
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: machinist
          image: machinist-control-plane
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          startupProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7341/', timeout=3).close()"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7341/', timeout=3).close()"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7341/', timeout=3).close()"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /var/lib/machinist
            - name: cluster-access
              mountPath: /etc/machinist
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: machinist-state
        - name: cluster-access
          configMap:
            name: machinist-cluster-access
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
