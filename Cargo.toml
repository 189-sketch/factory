[workspace]
resolver = "3"
members = ["factory-core"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
cron = "0.17"
dirs = "6.0"
fs2 = "0.4"
humantime = "2.2"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
axum = { version = "0.8", features = ["query", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
futures-core = "0.3"
async-stream = "0.3"
jsonschema = "0.49"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2.2"
nix = { version = "0.30", features = ["signal"] }
rustix = { version = "1.1", features = ["fs"] }
dunce = "1.0"
assert_cmd = "2.0"
predicates = "3.1"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/owainlewis/factory"
homepage = "https://github.com/owainlewis/factory"
